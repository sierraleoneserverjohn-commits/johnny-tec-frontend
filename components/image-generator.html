<div class="view-wrapper" style="padding: 20px; display: flex; flex-direction: column; height: 100%; color: #fff; box-sizing: border-box; font-family: 'Inter', sans-serif; overflow-y: auto;">

  <!-- Back button -->
  <button onclick="window.history.back()" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid #2a2a4a; color: #ccc; padding: 8px 14px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; font-size: 0.9rem;">
    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: #ccc; stroke-width: 2;">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    Back
  </button>

  <!-- Header -->
  <header style="margin-bottom: 20px;">
    <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem;">
      <span style="background: linear-gradient(90deg, #4facfe 0%, #a200ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Image</span> Generator
    </h2>
    <p style="color: #888; font-size: 0.9rem; margin-top: 5px;">Describe what you want to see, and the AI will create it.</p>
  </header>

  <!-- Prompt box -->
  <div style="position: relative; margin-bottom: 20px;">
    <textarea id="imgPrompt" maxlength="1000" placeholder="A futuristic neon cyber-city..." rows="4" style="width: 100%; box-sizing: border-box; padding: 15px; border-radius: 10px; border: 1px solid #2a2a4a; background: #0a0a1c; color: #fff; font-family: 'Inter', sans-serif; outline: none; resize: none;"></textarea>
    <span id="charCount" style="position: absolute; right: 12px; bottom: 10px; color: #666; font-size: 0.75rem;">0 / 1000</span>
  </div>

  <!-- Style presets -->
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;">
    <button class="style-btn" data-style="Cyberpunk" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 6px; color: #fff; cursor: pointer; font-size: 0.8rem;">🏙️<div>Cyberpunk</div></button>
    <button class="style-btn" data-style="Realistic" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 6px; color: #fff; cursor: pointer; font-size: 0.8rem;">📷<div>Realistic</div></button>
    <button class="style-btn" data-style="Anime" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 6px; color: #fff; cursor: pointer; font-size: 0.8rem;">⭐<div>Anime</div></button>
    <button class="style-btn" data-style="3D Render" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 6px; color: #fff; cursor: pointer; font-size: 0.8rem;">📦<div>3D Render</div></button>
  </div>

  <!-- Aspect ratio -->
  <div style="margin-bottom: 20px;">
    <div style="font-weight: bold; margin-bottom: 10px;">Aspect Ratio</div>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
      <button class="ratio-btn" data-ratio="1:1" style="background: #0a0a1c; border: 2px solid #4facfe; border-radius: 8px; padding: 12px 0; color: #fff; cursor: pointer; font-size: 0.75rem;">1:1</button>
      <button class="ratio-btn" data-ratio="16:9" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 0; color: #fff; cursor: pointer; font-size: 0.75rem;">16:9</button>
      <button class="ratio-btn" data-ratio="9:16" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 0; color: #fff; cursor: pointer; font-size: 0.75rem;">9:16</button>
      <button class="ratio-btn" data-ratio="4:3" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 0; color: #fff; cursor: pointer; font-size: 0.75rem;">4:3</button>
      <button class="ratio-btn" data-ratio="3:4" style="background: #0a0a1c; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 0; color: #fff; cursor: pointer; font-size: 0.75rem;">3:4</button>
    </div>
  </div>

  <!-- Image quality -->
  <div style="margin-bottom: 24px;">
    <div style="font-weight: bold; margin-bottom: 4px;">Image Quality</div>
    <div style="color: #888; font-size: 0.8rem; margin-bottom: 10px;">Higher quality uses more credits.</div>
    <select id="imgQuality" style="width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a2a4a; background: #0a0a1c; color: #fff; font-size: 0.95rem;">
      <option>High (Best Quality)</option>
      <option>Medium</option>
      <option>Standard</option>
    </select>
  </div>

  <!-- Generate button (single image only) -->
  <button id="generateBtn" style="padding: 16px; background: linear-gradient(90deg, #4facfe 0%, #a200ff 100%); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.05rem;">
    ✨ Generate Image
  </button>

  <!-- Result area -->
  <div style="flex: 1; margin-top: 20px; background: #0a0a1c; border: 2px dashed #2a2a4a; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; min-height: 160px;">
    <span id="resultPlaceholder" style="color: #666; font-size: 0.9rem;">Your generated image will appear here</span>
  </div>

</div>

<script>
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.style.border = '1px solid #2a2a4a');
      btn.style.border = '2px solid #4facfe';
    });
  });
  document.querySelectorAll('.ratio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ratio-btn').forEach(b => b.style.border = '1px solid #2a2a4a');
      btn.style.border = '2px solid #4facfe';
    });
  });
  document.getElementById('imgPrompt').addEventListener('input', function() {
    document.getElementById('charCount').textContent = `${this.value.length} / 1000`;
  });
</script>
