<div class="view-wrapper" style="padding: 20px; display: flex; flex-direction: column; height: 100%; color: #fff; box-sizing: border-box;">
  
  <header style="margin-bottom: 20px;">
    <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem;">
      <span class="gradient-text" style="background: linear-gradient(90deg, #a200ff 0%, #ff0055 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Image</span> Generator
    </h2>
    <p style="color: #888; font-size: 0.9rem; margin-top: 5px; font-family: 'Inter', sans-serif;">Turn text prompts into high-quality visual assets.</p>
  </header>

  <div style="flex: 1; background: #0a0a1c; border: 2px dashed #2a2a4a; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px;">
    <svg viewBox="0 0 24 24" style="width: 64px; height: 64px; fill: none; stroke: #444; stroke-width: 1.5; margin-bottom: 15px;">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <circle cx="9" cy="10" r="2"/>
      <path d="m5 18 5-5 4 4 3-3 4 4"/>
    </svg>
    <span style="color: #666; font-family: 'Inter', sans-serif; font-size: 0.95rem;">Awaiting your creative prompt...<br>Generated artwork will render here.</span>
  </div>

  <div style="margin-top: 20px; display: flex; gap: 10px;">
    <input type="text" placeholder="Describe the image (e.g., Cyberpunk city at night)..." style="flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #2a2a4a; background: #0a0a1c; color: #fff; font-family: 'Inter', sans-serif; outline: none;">
    <button style="padding: 0 20px; background: linear-gradient(90deg, #a200ff 0%, #ff0055 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Space Grotesk', sans-serif;">Generate</button>
  </div>

</div>
