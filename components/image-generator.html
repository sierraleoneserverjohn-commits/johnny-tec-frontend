<!-- components/image-generator.html -->
<div class="image-gen-container">
    <h2>Generate an Image</h2>
    <p>Describe what you want to see, and the AI will create it.</p>
    
    <div class="image-prompt-area">
        <textarea id="imagePrompt" placeholder="A futuristic neon cyber-city..."></textarea>
        <button id="generateImageBtn">Generate</button>
    </div>
    
    <!-- The generated image will appear here later -->
    <div id="imageResultBox"></div>
</div>
