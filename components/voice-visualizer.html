<!-- Voice Assistant Overlay -->
<div class="voice-overlay" id="voiceOverlay" hidden role="dialog" aria-modal="true" aria-label="Voice assistant">
  <button class="voice-close" id="voiceClose" aria-label="Close voice assistant">
    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>

  <!-- Top Status Pill -->
  <div class="voice-top-pill">
    <svg viewBox="0 0 24 24" class="voice-top-icon" id="voiceTopIcon"><path d="M12 3v18m-4-14v10m8-10v10m-12-6v2m16-2v2" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    <span id="voiceTopStatus">Listening...</span>
  </div>

  <!-- Visualizer & Mic Container -->
  <div class="voice-visualizer-wrapper">
    <canvas id="voiceCanvas" class="voice-canvas"></canvas>
    
    <div class="voice-ring" id="voiceRing" aria-hidden="true">
      <div class="voice-glow-bg"></div>
      <span class="voice-pulse"></span>
      <svg viewBox="0 0 24 24" class="voice-mic" id="voiceMicIcon">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </div>
  </div>

  <!-- Text Prompts -->
  <div class="voice-text-container">
    <h2 class="voice-main-text" id="voiceMainText">I'm listening</h2>
    <p class="voice-sub-text" id="voiceSubText">Speak now, I'm here to help</p>
  </div>

  <!-- Bottom Controls -->
  <div class="voice-controls">
    <button class="voice-btn voice-home" id="voiceHome" type="button" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="voice-btn voice-stop" id="voiceStop" type="button">
      <div class="stop-icon-box"></div> Stop Listening
    </button>
  </div>
</div>
