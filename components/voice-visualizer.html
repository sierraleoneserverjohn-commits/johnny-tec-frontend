<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Voice Interface</title>
  <link rel="stylesheet" href="voice_visualization.css">
</head>
<body>
  <div class="voice-screen">
    
    <!-- Topbar (Retained from your existing design) -->
    <header class="topbar">
      <button class="icon-btn">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
      </button>
      <div class="topbar-title">
        <h2>AI Assistant</h2>
        <span>Smart. Fast. Reliable.</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn">
          <div class="notif-dot"></div>
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <div class="topbar-avatar">
          <img src="https://i.pravatar.cc/150?img=11" alt="User">
          <div class="status-dot"></div>
        </div>
      </div>
    </header>

    <!-- Main Voice Interface -->
    <main class="voice-container">
      
      <!-- Status Pill -->
      <div class="status-pill" id="statusPill">
        <svg class="waveform-icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="10" width="2" height="4" rx="1" />
          <rect x="7" y="6" width="2" height="12" rx="1" />
          <rect x="11" y="3" width="2" height="18" rx="1" />
          <rect x="15" y="7" width="2" height="10" rx="1" />
          <rect x="19" y="11" width="2" height="2" rx="1" />
        </svg>
        <span id="statusText">Listening...</span>
      </div>

      <!-- Canvas for Real-time Web Audio Visualizer -->
      <canvas id="visualizerCanvas"></canvas>

      <!-- Center Microphone Icon -->
      <div class="center-mic-container" id="micContainer">
        <div class="mic-glow-ring inner"></div>
        <div class="mic-glow-ring outer"></div>
        <div class="mic-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
      </div>

      <!-- Text Prompts -->
      <div class="voice-text-container">
        <h1 class="gradient-text" id="primaryText">I'm listening</h1>
        <p class="sub-text" id="secondaryText">Speak now, I'm here to help</p>
      </div>

      <!-- Error Message (Hidden by default) -->
      <div id="errorMessage" class="error-msg"></div>
    </main>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button id="btnHome" class="control-btn btn-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
      </button>
      <button id="btnStop" class="control-btn btn-stop">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        </svg>
        Stop Listening
      </button>
    </div>

    <!-- Hidden Audio element for AI Voice output -->
    <audio id="aiAudio" crossorigin="anonymous"></audio>

  </div>
  <script src="voice_visualization.js"></script>
</body>
</html>
