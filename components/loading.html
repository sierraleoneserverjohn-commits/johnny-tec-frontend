<!-- ===================== LOADING SCREEN ===================== -->
<div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
  
  <!-- 60FPS Canvas Waveform & Particles -->
  <canvas id="loadingCanvas" class="loading-canvas"></canvas>

  <!-- Central AI Logo -->
  <div class="loading-logo-container">
    <svg class="loading-rings" viewBox="0 0 160 160" aria-hidden="true">
      <!-- Outer Track -->
      <circle class="ring-base" cx="80" cy="80" r="74"></circle>
      <!-- Fast Cyan Sweep -->
      <circle class="ring-sweep-cyan" cx="80" cy="80" r="74"></circle>
      <!-- Inner Purple Sweep -->
      <circle class="ring-sweep-purple" cx="80" cy="80" r="62"></circle>
    </svg>
    <div class="logo-mark">JT</div>
  </div>

  <!-- Branding Text -->
  <div class="loading-text-content">
    <h1 class="loading-title">Johnny Tec <span class="title-highlight">AI</span></h1>
    <p class="loading-tagline">Smart. Fast. Reliable.</p>
  </div>

  <!-- Loading Bar & Status -->
  <div class="loading-progress-container">
    <div class="loading-status">
      <span class="status-label">Loading</span>
      <span class="status-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>

    <div class="loading-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="loading-bar-fill" id="loadingBarFill"></div>
    </div>
    
    <span class="loading-percent" id="loadingPercent">0%</span>
  </div>
</div>
