<section class="main-screen" aria-label="AI Assistant chat">

  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="topbar-title">
      <h2 class="gradient-text">AI Assistant</h2>
      <span>Smart. Fast. Reliable.</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="notif-dot" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      
      <!-- UPDATED: 3-Dots Button replacing the Avatar -->
      <button class="icon-btn" id="rightBarToggle" aria-label="Open settings panel">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: currentColor;">
          <circle cx="12" cy="5" r="2.5"/>
          <circle cx="12" cy="12" r="2.5"/>
          <circle cx="12" cy="19" r="2.5"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="chat-scroll" id="chatScroll">

    <div class="greeting" id="greeting">
      <p class="greeting-hi">👋 Hey <span class="gradient-text">Johnny</span>,</p>
      <h1>How can I help you today?</h1>
      <p class="greeting-sub">Your AI assistant is ready to help you with anything you need.</p>

      <div class="quick-grid">
        <button class="quick-card" data-prompt="Generate code for ">
          <span class="quick-icon icon-cyan">&lt;/&gt;</span>
          <b>Code</b><small>Generate code</small>
        </button>
        <button class="quick-card" data-prompt="Explain this to me: ">
          <span class="quick-icon icon-blue">☰</span>
          <b>Explain</b><small>Explain anything</small>
        </button>
        <button class="quick-card" data-prompt="Create content about ">
          <span class="quick-icon icon-purple">✎</span>
          <b>Create</b><small>Create content</small>
        </button>
        <button class="quick-card" data-prompt="Help me solve: ">
          <span class="quick-icon icon-magenta">◈</span>
          <b>Solve</b><small>Solve problems</small>
        </button>
      </div>
    </div>

    <div class="chat-log" id="chatLog"></div>

    <div class="suggestions" id="suggestions" hidden></div>
  </div>

  <form class="composer" id="composer">
    <div class="composer-inner glass">
      <button type="button" class="composer-icon" aria-label="Add attachment menu">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="composer-icon" aria-label="Attach file">
        <svg viewBox="0 0 24 24"><path d="m21.4 11.4-8.5 8.5a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10.9 17a2 2 0 1 1-3-3l7-7"/></svg>
      </button>
      <input type="text" id="composerInput" class="composer-input" placeholder="Type your message..." autocomplete="off">
      
      <!-- UPDATED: ID changed to chat-mic-btn to connect to the JS -->
      <button type="button" class="composer-icon" id="chat-mic-btn" aria-label="Voice input">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      
      <button type="button" class="composer-icon" aria-label="Smart suggestions">
        <svg viewBox="0 0 24 24"><path d="m12 2 2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z"/></svg>
      </button>
      <button type="submit" class="composer-send" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </form>
 </section>
