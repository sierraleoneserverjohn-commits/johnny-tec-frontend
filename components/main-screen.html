<!-- main-screen.html — the center hub. Injected into #mount-main-screen by app.js. -->
<div class="main-screen">

  <header class="ms-topbar">
    <button class="ms-icon-btn" id="msMenuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <!-- AI Profile is its own component: components/ai-profile.html, css/ai-profile.css, js/ai-profile.js -->
    <div id="mount-ai-profile" class="mount mount-ai-profile" data-component="ai-profile"></div>

    <div class="ms-brand">
      <h1 class="ms-brand-title font-display neon-text-gradient">AI Assistant</h1>
      <p class="ms-brand-tagline">Smart. Fast. Reliable.</p>
    </div>

    <div class="ms-topbar-actions">
      <div class="ms-popover-wrap">
        <button class="ms-icon-btn" id="msNotifBtn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="ms-dot" id="msNotifDot" aria-hidden="true"></span>
        </button>
        <div class="ms-popover" id="msNotifPopover" role="menu" hidden>
          <p class="ms-popover-empty">You're all caught up — no new notifications.</p>
        </div>
      </div>

      <button class="ms-icon-btn" id="msThemeBtn" aria-pressed="false" aria-label="Toggle theme">
        <svg class="ms-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </button>

      <div class="ms-popover-wrap">
        <button class="ms-avatar-btn" id="msAvatarBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="ms-avatar-ring">
            <svg viewBox="0 0 24 24" class="ms-avatar-fallback"><circle cx="12" cy="8.5" r="3.4" fill="currentColor"/><path d="M4 20c1.6-4 5-6 8-6s6.4 2 8 6" fill="currentColor"/></svg>
          </span>
          <span class="ms-avatar-status" aria-hidden="true"></span>
        </button>
        <div class="ms-popover ms-popover-right" id="msAvatarPopover" role="menu" hidden>
          <button type="button" role="menuitem">Profile</button>
          <button type="button" role="menuitem">Settings</button>
          <button type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="ms-body" id="msBody">

    <section class="ms-welcome" id="msWelcome">
      <p class="ms-greeting" id="msGreetingLine">
        <span aria-hidden="true">👋</span> Hey, I'm Johnny Tec AI —
      </p>
      <h2 class="ms-headline" id="msHeadline">How can I help you today?</h2>
      <p class="ms-subline" id="msSubline">Your AI assistant is ready to help you with anything you need.</p>

      <div class="ms-quick-grid">
        <button type="button" class="ms-quick-card" data-prompt="Write code that ">
          <span class="ms-quick-icon ms-quick-icon-code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>
          </span>
          <span class="ms-quick-title">Code</span>
          <span class="ms-quick-desc">Generate code</span>
        </button>

        <button type="button" class="ms-quick-card" data-prompt="Explain ">
          <span class="ms-quick-icon ms-quick-icon-explain">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </span>
          <span class="ms-quick-title">Explain</span>
          <span class="ms-quick-desc">Explain anything</span>
        </button>

        <button type="button" class="ms-quick-card" data-prompt="Create ">
          <span class="ms-quick-icon ms-quick-icon-create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-3.5L15.5 5a1.5 1.5 0 0 1 2 0l1.5 1.5a1.5 1.5 0 0 1 0 2L7.5 20H4Z"/></svg>
          </span>
          <span class="ms-quick-title">Create</span>
          <span class="ms-quick-desc">Create content</span>
        </button>

        <button type="button" class="ms-quick-card" data-prompt="Help me solve ">
          <span class="ms-quick-icon ms-quick-icon-solve">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 12l9 9 9-9-9-9Z"/></svg>
          </span>
          <span class="ms-quick-title">Solve</span>
          <span class="ms-quick-desc">Solve problems</span>
        </button>
      </div>
    </section>

    <section class="ms-chat-log" id="msChatLog" hidden aria-live="polite"></section>
  </div>

  <div class="ms-attachments" id="msAttachments" hidden></div>

  <form class="ms-inputbar-wrap" id="msInputForm">
    <div class="ms-inputbar glass-panel">

      <div class="ms-popover-wrap">
        <button type="button" class="ms-bar-btn" id="msPlusBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Add image, video, or file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="ms-plus-menu" id="msPlusMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-accept="image/*" data-kind="Image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5.5-5.5L4 21"/></svg>
            Image
          </button>
          <button type="button" role="menuitem" data-accept="video/*" data-kind="Video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m21 9-5 3 5 3V9Z"/></svg>
            Video
          </button>
          <button type="button" role="menuitem" data-accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.md" data-kind="File">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>
            File
          </button>
        </div>
      </div>

      <button type="button" class="ms-bar-btn" id="msClipBtn" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5 12.5 21a4.5 4.5 0 0 1-6.4-6.4l8.5-8.5a3 3 0 0 1 4.24 4.24l-8.5 8.5a1.5 1.5 0 0 1-2.12-2.12l7.79-7.79"/></svg>
      </button>

      <input type="text" class="ms-input" id="msInput" placeholder="Type your message" autocomplete="off" enterkeyhint="send" />

      <button type="button" class="ms-bar-btn" id="msMicBtn" aria-pressed="false" aria-label="Speak your message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>

      <button type="button" class="ms-bar-btn ms-bar-btn-sparkle" id="msSparkleBtn" aria-label="Prompt ideas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>
      </button>

      <button type="submit" class="ms-send-btn" id="msSendBtn" aria-label="Start live conversation">
        <svg class="ms-send-icon ms-send-icon-live" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h2l2-6 3 12 2-9 2 6h3"/></svg>
        <svg class="ms-send-icon ms-send-icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </form>

  <input type="file" id="msFileInput" hidden />
</div>
