<!-- profile.html — sidebar footer identity block. Its own component: profile.css / profile.js. -->
<div class="profile-block">

  <div class="profile-status">
    <span class="profile-status-dot" id="profileStatusDot" aria-hidden="true"></span>
    <span class="profile-status-text" id="profileStatusText">All systems online</span>
  </div>

  <button type="button" class="profile-identity" id="profileBtn" aria-haspopup="true" aria-expanded="false">
    <span class="profile-avatar-ring">
      <svg viewBox="0 0 24 24" class="profile-avatar-fallback"><circle cx="12" cy="8.5" r="3.4" fill="currentColor"/><path d="M4 20c1.6-4 5-6 8-6s6.4 2 8 6" fill="currentColor"/></svg>
      <span class="profile-avatar-status" aria-hidden="true"></span>
    </span>

    <span class="profile-meta">
      <span class="profile-name">Johnny</span>
      <span class="profile-plan">
        <svg viewBox="0 0 24 24" class="profile-plan-icon" fill="currentColor"><path d="M12 2 9 8l-6 1 4.5 4.4L6 20l6-3.2L18 20l-1.5-6.6L21 9l-6-1-3-6Z"/></svg>
        Pro Plan
      </span>
    </span>

    <svg class="profile-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>

  <div class="profile-menu" id="profileMenu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      Settings
    </button>
    <button type="button" role="menuitem" data-action="usage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      Usage
    </button>
    <button type="button" role="menuitem" data-action="sign-out" class="profile-menu-danger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Sign out
    </button>
  </div>
</div>
