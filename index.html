<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JOHNNY TEC AI Assistant</title>
<meta name="description" content="Johnny Tec.Dev — Building Digital Excellence. A cyber-neon AI assistant.">

<!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (data/labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/loading.css">
<link rel="stylesheet" href="css/avatar.css">
<link rel="stylesheet" href="css/left-bar.css">
<link rel="stylesheet" href="css/main-screen.css">
<link rel="stylesheet" href="css/right-bar.css">
<link rel="stylesheet" href="css/voice-visualizer.css">
</head>
<body>

  <!-- Loading Screen: static shell, populated by components/loading.html -->
  <div id="loading-screen" class="mount"></div>

  <div id="app-shell" class="app-shell" hidden>
    <div id="left-bar" class="mount"></div>
    <div id="main-screen" class="mount"></div>
    <div id="right-bar" class="mount"></div>
  </div>

  <!-- Voice visualizer is an overlay, mounted globally, hidden until invoked -->
  <div id="voice-visualizer" class="mount"></div>

  <script type="module" src="app.js"></script>
  <!-- At the bottom of index.html -->
<script src="js/left-bar.js"></script>
<script src="js/right-bar.js"></script>
<script src="js/main-screen.js"></script>
<script src="js/app.js"></script>
</body>
  
</body>
</html>
