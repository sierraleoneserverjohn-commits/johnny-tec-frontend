<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOHNNY TEC AI Assistant</title>
    
    <!-- Google Fonts for the Cyber Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <!-- CSS Design System Links -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/loading.css">
    <link rel="stylesheet" href="./css/left-bar.css">
    <link rel="stylesheet" href="./css/main-screen.css">
    <link rel="stylesheet" href="./css/right-bar.css">
    <link rel="stylesheet" href="./css/voice-visualizer.css">
</head>
<body>

    <!-- 1. Splash Screen Mount -->
    <div id="loading-container"></div>

    <!-- 2. Core App Layout (Flexbox Container) -->
    <div id="app-root" style="display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative;">
        
        <!-- Sidebar Navigation -->
        <div id="left-sidebar-container"></div>
        
        <!-- Main Chat Interface -->
        <div id="main-chat-container" style="flex-grow: 1; position: relative;"></div>
        
        <!-- Right Settings Panel -->
        <div id="right-sidebar-container"></div>

    </div>

    <!-- 3. Voice Visualizer Mount (Hidden by default) -->
    <div id="voice-visualizer-container"></div>

    <!-- 4. Async Orchestrator Initialization -->
    <script src="./app.js"></script>
    
</body>
</html>
