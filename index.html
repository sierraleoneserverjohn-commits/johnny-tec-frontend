<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JOHNNY TEC AI Assistant</title>
<meta name="description" content="Johnny Tec.Dev — Building Digital Excellence. A cyber-neon AI assistant.">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- CSS Stylesheets -->

<link rel="stylesheet" href="css/loading.css">

<body>

  <div id="app-shell" class="app-shell" hidden>

    <div id="main-screen" class="mount"></div>
