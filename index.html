<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOHNNY TEC AI Assistant</title>
  <meta name="description" content="JOHNNY TEC AI Assistant — Building Digital Excellence" />

  <!-- Global design tokens, reset, and shared utility classes. Every component CSS file is loaded on top of this. -->
  <link rel="stylesheet" href="css/global.css" />

  <!-- Google Fonts: display + body + mono pairing used across all components -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <!-- Loading screen sits above everything until app.js signals the app is ready, then unmounts itself -->
  <div id="mount-loading" class="mount mount-loading" data-component="loading"></div>

  <!-- Core app shell: three-column layout. Hidden behind the loading screen until ready. -->
  <div id="app-shell" class="app-shell" hidden>
    <aside id="mount-left-bar" class="mount mount-left-bar" data-component="left-bar"></aside>

    <main id="mount-main-screen" class="mount mount-main-screen" data-component="main-screen"></main>

    <aside id="mount-right-bar" class="mount mount-right-bar" data-component="right-bar"></aside>
  </div>

  <!-- Voice visualizer is a floating overlay component, not part of the 3-column grid flow -->
  <div id="mount-voice-visualizer" class="mount mount-voice-visualizer" data-component="voice-visualizer" hidden></div>

  <!-- Orchestrator: fetches each component's HTML, injects it, then lazy-loads that component's CSS + JS -->
  <script src="app.js"></script>
</body>
</html>
