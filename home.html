<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny Tec.Dev - AI</title>
    <style>
        :root {
            --bg-dark: #03030b; --panel-bg: #0a0a16; --border-color: #1a1a2e;
            --text-main: #ffffff; --text-muted: #8b8b9f;
            --accent-blue: #00d2ff; --accent-purple: #b500ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            padding: 15px;
            gap: 15px;
            overflow-x: auto; /* Allows swiping left/right on mobile */
            scroll-snap-type: x mandatory; /* Smooth snapping */
        }

        /* Standardized Panel Style */
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            scroll-snap-align: center;
        }

        .sidebar-left { min-width: 260px; }
        .sidebar-right { min-width: 300px; overflow-y: auto; }
        .main-chat { min-width: 100%; flex: 1; position: relative; }

        @media (min-width: 1024px) {
            .main-chat { min-width: 500px; } /* Desktop width fixing */
        }

        /* Internal Styles pulled from previous version */
        .jt-ring { width: 70px; height: 70px; border-radius: 50%; border-top: 2px solid var(--accent-blue); border-bottom: 2px solid var(--accent-purple); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; font-weight: 900; font-style: italic; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area { text-align: center; margin-bottom: 20px; }
        .menu-list { list-style: none; flex: 1; }
        .menu-list li { padding: 12px; color: var(--text-muted); margin-bottom: 5px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; }
        .menu-list li.active { background-color: rgba(181, 0, 255, 0.1); color: var(--accent-blue); border-left: 3px solid var(--accent-purple); }
        
        .chat-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 10px 0; }
        .chat-bubble { max-width: 85%; padding: 15px; border-radius: 15px; line-height: 1.5; font-size: 14px; }
        .user-bubble { background-color: #1a1a3a; align-self: flex-end; border-bottom-right-radius: 5px; }
        .ai-bubble { border: 1px solid var(--border-color); align-self: flex-start; border-bottom-left-radius: 5px; }
        
        .input-box { display: flex; align-items: center; background-color: #111122; border: 1px solid var(--border-color); border-radius: 15px; padding: 10px; margin-top: 15px; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        .send-btn { background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LEFT BAR (Fetched via JS) -->
    <div id="left-sidebar" class="panel sidebar-left"></div>

    <!-- MAIN CHAT -->
    <div class="panel main-chat">
        <h2 style="color: var(--accent-blue); margin-bottom: 20px;">AI <span style="color: var(--accent-purple);">Assistant</span></h2>
        
        <div class="chat-area" id="chat-area">
            <div class="chat-bubble ai-bubble">
                👋 Hey Johnny, your Groq Llama 3.1 API is ready. What are we building today?
            </div>
        </div>

        <div class="input-box">
            <input type="text" id="chat-input" placeholder="Message Johnny Tec AI...">
            <button class="send-btn" id="send-btn">➔</button>
        </div>
    </div>

    <!-- RIGHT BAR (Fetched via JS) -->
    <div id="right-sidebar" class="panel sidebar-right"></div>

    <!-- SCRIPT TO LOAD EVERYTHING TOGETHER -->
    <script>
        // Fetch the Left Menu
        fetch('left.html')
            .then(response => response.text())
            .then(data => { document.getElementById('left-sidebar').innerHTML = data; });

        // Fetch the Right Stats
        fetch('right.html')
            .then(response => response.text())
            .then(data => { document.getElementById('right-sidebar').innerHTML = data; });
    </script>
    
    <!-- Connect API Logic -->
    <script src="api.js"></script>

</body>
</html>
